services:
  backend:
    build: ./backend
    container_name: todo-backend
    environment:
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: todo-frontend
    expose:
      - "80"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: todo-local-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
